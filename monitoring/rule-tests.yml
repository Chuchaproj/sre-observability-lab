rule_files: [/etc/prometheus/alerts.yml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="backend",instance="backend:8000"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackendUnavailable
        exp_alerts:
          - exp_labels:
              job: backend
              instance: backend:8000
              severity: critical
            exp_annotations:
              summary: Backend metrics endpoint unavailable
              runbook: RUNBOOK.md
