name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint
      - run: make install test
      - run: .venv/bin/ruff check app tests scripts && shellcheck scripts/*.sh && yamllint -c .yamllint compose.yaml monitoring .github
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile}
      - run: make init up smoke
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rule-tests.yml
      - name: Redis incident and recovery
        run: |
          bash scripts/incident.sh redis
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8180/items)" = 503
          make recover
      - run: make load
      - if: always()
        run: docker compose logs --no-color && make down
